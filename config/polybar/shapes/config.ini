;; Global WM Settings

[global/wm]
; Adjust the _NET_WM_STRUT_PARTIAL top value
; Used for top aligned bars
margin-bottom = 0

; Adjust the _NET_WM_STRUT_PARTIAL bottom value
; Used for bottom aligned bars
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; File Inclusion
; include an external file, like module file, etc.

include-file = ~/.config/polybar/shapes/bars.ini
include-file = ~/.config/polybar/shapes/colors.ini
include-file = ~/.config/polybar/shapes/glyphs.ini
include-file = ~/.config/polybar/shapes/modules.ini
include-file = ~/.config/polybar/shapes/user_modules.ini
include-file = ~/.config/polybar/shapes/islands.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Bar Settings

[bar/main]
; DLL: one transparent bar, every module is a separate rounded "island".
; Island colours come from colors.ini (generated from the wallpaper).
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false
wm-restack = bspwm
bottom = false
fixed-center = true

width = 100%:-24
height = 30
offset-x = 12
offset-y = 8
radius = 0

background = #00000000
foreground = ${color.foreground}

border-size = 0
padding = 0
module-margin = 0

; text, island caps, bigger icons, logo, workspace dots
font-0 = "Iosevka Nerd Font:pixelsize=11;3"
font-1 = "Iosevka Nerd Font:pixelsize=30;6"
font-2 = "Iosevka Nerd Font:pixelsize=14;3"
font-3 = "Hack Nerd Font Propo:pixelsize=18;4"
font-4 = "Iosevka Nerd Font:pixelsize=8;2"

modules-left = dll-launcher-l dll-launcher dll-launcher-r dll-clock-l dll-clock dll-clock-r dll-ethernet-l dll-ethernet dll-ethernet-r dll-vpn-l dll-vpn dll-vpn-r
modules-center = dll-workspaces-l dll-workspaces dll-workspaces-r
modules-right = dll-target-l dll-target dll-target-r dll-wallpaper-l dll-wallpaper dll-wallpaper-r dll-volume-l dll-volume dll-volume-r dll-power-l dll-power dll-power-r

separator =
dim-value = 1.0
tray-position = none
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[settings]
; The throttle settings lets the eventloop swallow up til X events
; if they happen within Y millisecond after first event was received.
; This is done to prevent flood of update event.
;
; For example if 5 modules emit an update event at the same time, we really
; just care about the last one. But if we wait too long for events to swallow
; the bar would appear sluggish so we continue if timeout
; expires or limit is reached.
throttle-output = 5
throttle-output-for = 10

; Time in milliseconds that the input handler will wait between processing events
;throttle-input-for = 30

; Reload upon receiving XCB_RANDR_SCREEN_CHANGE_NOTIFY events
screenchange-reload = false

; Compositing operators
; @see: https://www.cairographics.org/manual/cairo-cairo-t.html#cairo-operator-t
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Define fallback values used by all module formats
;format-foreground = 
;format-background = 
;format-underline =
;format-overline =
;format-spacing =
;format-padding =
;format-margin =
;format-offset =

; Enables pseudo-transparency for the bar
; If set to true the bar can be transparent without a compositor.
pseudo-transparency = false

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
