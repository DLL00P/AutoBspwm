;; ┌───────────────────────────────────────────────────────────┐
;; │ DLL islands. Each island = <name>-l + <name> + <name>-r     │
;; │ (rounded caps are separate modules). Colours come from      │
;; │ colors.ini, regenerated from the wallpaper.                 │
;; └───────────────────────────────────────────────────────────┘

[module/dll-launcher-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-launcher]
type = custom/text
format = <label>
format-background = ${color.background}
; Kali dragon (Hack Nerd Font, font-3)
label = ""
label-font = 4
label-foreground = ${color.accent}
; the glyph sits left in its advance box: pad more on the left
label-padding-left = 5px
label-padding-right = 0
click-left = ~/.config/polybar/shapes/scripts/launcher.sh &
click-right = ~/.config/bspwm/scripts/wallpaper.sh --pick &

[module/dll-launcher-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-clock-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-clock]
type = internal/date
interval = 1
date = %d %b
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M:%S
format = <label>
format-background = ${color.background}
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = %date%  %time%

[module/dll-clock-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-ethernet-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-ethernet]
type = custom/script
exec = ~/.config/polybar/shapes/scripts/ethernet_status.sh
interval = 5
format = <label>
format-background = ${color.background}
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = %output%
label-maxlen = 40

[module/dll-ethernet-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-vpn-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-vpn]
type = custom/script
exec = ~/.config/polybar/shapes/scripts/vpn_status.sh
interval = 3
format = <label>
format-background = ${color.background}
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = %output%
label-maxlen = 40

[module/dll-vpn-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-target-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-target]
type = custom/script
exec = ~/.config/polybar/shapes/scripts/htb_target.sh
interval = 2
format = <label>
format-background = ${color.background}
format-prefix = " "
format-prefix-foreground = ${color.accent}
label = %output%
label-maxlen = 40

[module/dll-target-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-workspaces-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
; active desktop = bug, occupied = dot, empty = hollow dot
format = <label-state>
format-background = ${color.background}
label-active = ""
label-active-foreground = ${color.accent}
label-active-font = 3
label-active-padding = 1
label-occupied = ""
label-occupied-foreground = ${color.foreground}
label-occupied-font = 5
label-occupied-padding = 1
label-urgent = ""
label-urgent-foreground = ${color.urgent}
label-urgent-font = 5
label-urgent-padding = 1
label-empty = ""
label-empty-foreground = ${color.dim}
label-empty-font = 5
label-empty-padding = 1

[module/dll-workspaces-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-wallpaper-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-wallpaper]
type = custom/script
; image icon, or a pin while the wallpaper is pinned
; left click: random | middle: picker | right: pin/unpin
exec = [ -f ~/.cache/wallpaper/pinned ] && echo "" || echo ""
interval = 2
format = <label>
format-background = ${color.background}
label = %output%
label-foreground = ${color.accent}
click-left = ~/.config/bspwm/scripts/wallpaper.sh --random &
click-middle = ~/.config/bspwm/scripts/wallpaper.sh --pick &
click-right = ~/.config/bspwm/scripts/wallpaper.sh --pin &

[module/dll-wallpaper-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-volume-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.background}

[module/dll-volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-background = ${color.background}
format-muted = <label-muted>
format-muted-background = ${color.background}
ramp-volume-0 = 
ramp-volume-foreground = ${color.accent}
label-volume = %percentage%%
label-muted = " muted"
label-muted-foreground = ${color.dim}
click-right = pavucontrol &

[module/dll-volume-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.background}

[module/dll-power-l]
type = custom/text
format = <label>
format-font = 2
format-margin-left = 4px
label = ""
label-foreground = ${color.accent}

[module/dll-power]
type = custom/text
format = <label>
format-background = ${color.accent}
label = ""
label-foreground = ${color.on-accent}
click-left = ~/.config/polybar/shapes/scripts/powermenu.sh &

[module/dll-power-r]
type = custom/text
format = <label>
format-font = 2
format-margin-right = 4px
label = ""
label-foreground = ${color.accent}
